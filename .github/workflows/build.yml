name: Build and regression tests
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y g++ make rapidjson-dev
      - name: Build and regression tests
        run: make check
      - name: CLI smoke test
        run: ./bin/hashcheck-rc --help

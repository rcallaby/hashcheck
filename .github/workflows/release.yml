name: Build Debian artifact
on:
  workflow_dispatch:
  push:
    tags: ['v*.*.*']
permissions:
  contents: read
jobs:
  deb:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y g++ make rapidjson-dev
      - name: Test
        run: make check
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then version="0.0.0"; fi
          mkdir -p pkg/DEBIAN pkg/usr/bin pkg/usr/share/doc/hashcheck-rc pkg/usr/share/man/man1
          install -m 755 bin/hashcheck-rc pkg/usr/bin/hashcheck-rc
          install -m 644 README.md LICENSE pkg/usr/share/doc/hashcheck-rc/
          gzip -cn docs/hashcheck.1 > pkg/usr/share/man/man1/hashcheck-rc.1.gz
          cat > pkg/DEBIAN/control <<EOF
          Package: hashcheck-rc
          Version: $version
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: Hashcheck maintainers <noreply@github.com>
          Depends: hashcat
          Description: Conservative hash format detection and Hashcat wrapper
          EOF
          dpkg-deb --build --root-owner-group pkg "hashcheck-rc_${version}_amd64.deb"
      - uses: actions/upload-artifact@v4
        with:
          name: deb-package
          path: '*.deb'
